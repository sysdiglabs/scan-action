name: Scan Image on PR

on:
  pull_request:

jobs:
  scan-multi-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # Base OS / Distro
          - alpine:3
          - ubuntu:24.04
          - debian:bookworm-slim
          - amazonlinux:2023
          - registry.access.redhat.com/ubi9/ubi-minimal:latest
          - oraclelinux:9-slim
          - rockylinux:9-minimal
          - opensuse/leap:15.6
          - archlinux:base
          # Runtimes / Languages
          - node:22-slim
          - node:22-alpine
          - python:3.13-slim
          - golang:1.24
          - rust:1-slim
          - eclipse-temurin:21-jre
          - ruby:3.3-slim
          - php:8.3-fpm
          - mcr.microsoft.com/dotnet/runtime:9.0
          # Databases / Data
          - postgres:17
          - mysql:8.4
          - redis:7-alpine
          - mongo:8.0
          - mariadb:11
          # Infra / Middleware
          - nginx:1-alpine
          - traefik:v3.3
          - envoyproxy/envoy:v1.32-latest
          - haproxy:3.1-alpine
          - hashicorp/vault:1.18
          # Container ecosystem
          - busybox:latest
          - gcr.io/distroless/static-debian12:latest
          - gcr.io/distroless/java21-debian12:latest
          - chainguard/wolfi-base:latest
          - bitnami/kubectl:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan ${{ matrix.image }}
        id: scan
        uses: ./
        with:
          image-tag: ${{ matrix.image }}
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: false
          stop-on-processing-error: true

      - name: Verify scanReport output
        run: |
          REPORT="${{ steps.scan.outputs.scanReport }}"
          if [ -z "$REPORT" ]; then
            echo "scanReport output is empty."
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "scanReport file does not exist: $REPORT"
            exit 1
          fi
          echo "scanReport output OK: $REPORT"

  scan-from-registry:
    runs-on: ubuntu-latest

    steps:
      # This step checks out a copy of your repository.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan dummy-vuln-app from registry
        id: scan
        uses: ./
        continue-on-error: true
        with:
          # Tag of the image to analyse
          image-tag: sysdiglabs/dummy-vuln-app:latest
          # API token for Sysdig Scanning auth
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: true
          stop-on-processing-error: true
          severity-at-least: medium

      - name: Verify scanReport output is set and valid
        if: success() || failure()
        run: |
          REPORT="${{ steps.scan.outputs.scanReport }}"
          if [ -z "$REPORT" ]; then
            echo "scanReport output is empty."
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "scanReport file does not exist: $REPORT"
            exit 1
          fi
          echo "scanReport output OK: $REPORT"

      - name: Upload SARIF file
        if: success() || failure() # Upload results regardless previous step fails
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: ${{ github.workspace }}/sarif.json

      - name: Check that the scan has failed
        run: |
          if [ "${{ steps.scan.outcome }}" == "success" ]; then
            echo "Scan succeeded but the step should fail."
            exit 1
          else
            echo "Scan failed as expected."
          fi

  filtered-scan-from-registry:
    runs-on: ubuntu-latest

    steps:
      # This step checks out a copy of your repository.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan dummy-vuln-app from registry
        id: scan
        uses: ./
        continue-on-error: true
        with:
          # Tag of the image to analyse
          image-tag: sysdiglabs/dummy-vuln-app:latest
          # API token for Sysdig Scanning auth
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: true
          stop-on-processing-error: true
          severity-at-least: medium
          group-by-package: true

      - name: Upload SARIF file
        if: success() || failure() # Upload results regardless previous step fails
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: ${{ github.workspace }}/sarif.json

      - name: Check that the scan has failed
        run: |
          if [ "${{ steps.scan.outcome }}" == "success" ]; then
            echo "Scan succeeded but the step should fail."
            exit 1
          else
            echo "Scan failed as expected."
          fi

  scan-with-old-scanner-version:
    runs-on: ubuntu-latest

    steps:
      # This step checks out a copy of your repository.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan dummy-vuln-app from registry
        id: scan
        uses: ./
        continue-on-error: true
        with:
          # Old scanner version
          cli-scanner-version: 1.18.0
          # Tag of the image to analyse
          image-tag: sysdiglabs/dummy-vuln-app:latest
          # API token for Sysdig Scanning auth
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: true
          stop-on-processing-error: true
          severity-at-least: medium

      - name: Upload SARIF file
        if: success() || failure() # Upload results regardless previous step fails
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: ${{ github.workspace }}/sarif.json

      - name: Check that the scan has failed
        run: |
          if [ "${{ steps.scan.outcome }}" == "success" ]; then
            echo "Scan succeeded but the step should fail."
            exit 1
          else
            echo "Scan failed as expected."
          fi

  standalone-scan-from-registry:
    runs-on: ubuntu-latest

    steps:
      # This step checks out a copy of your repository.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Donate MainDB from scan
        id: donnor-scan
        uses: ./
        with:
          # Tag of the image to analyse
          image-tag: sysdiglabs/dummy-vuln-app:latest
          # API token for Sysdig Scanning auth
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: false
          stop-on-processing-error: true
          skip-summary: true

      - name: Scan dummy-vuln-app from registry
        id: scan
        uses: ./
        with:
          # Tag of the image to analyse
          image-tag: sysdiglabs/dummy-vuln-app:latest
          # API token for Sysdig Scanning auth
          #sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: true
          stop-on-processing-error: true
          standalone: true

      - name: Upload SARIF file
        if: success() || failure() # Upload results regardless previous step fails
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: ${{ github.workspace }}/sarif.json

  scan-with-multiple-policies:
    runs-on: ubuntu-latest

    steps:
      # This step checks out a copy of your repository.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan repository with multiple IaC policies
        id: scan
        uses: ./
        continue-on-error: true
        with:
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          mode: iac
          iac-scan-path: ./tests/fixtures/iac/
          # Note: This test assumes these policies exist in the target Sysdig Secure account.
          use-policies: '"All Posture Findings", "MITRE DEFEND"'
          stop-on-processing-error: true

      - name: Check that the scan has succeeded
        run: |
          if [ "${{ steps.scan.outcome }}" == "success" ]; then
            echo "Scan succeeded as expected."
          else
            echo "Scan failed but it should have succeeded."
            exit 1
          fi

  scan-with-correct-checksum:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan with correct checksum
        id: scan
        uses: ./
        with:
          cli-scanner-version: '1.22.6'
          cli-scanner-sha256sum: '68ec2fc48c6ad61eba60a2469c5548153700fedab40ac79e34b7baa5f2e86e42'
          image-tag: sysdiglabs/dummy-vuln-app:latest
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}
          stop-on-failed-policy-eval: false

      - name: Check that the scan has succeeded
        run: |
          if [ "${{ steps.scan.outcome }}" == "success" ]; then
            echo "Scan succeeded as expected."
          else
            echo "Scan failed but it should have succeeded."
            exit 1
          fi

  scan-with-incorrect-checksum:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan with incorrect checksum
        id: scan
        uses: ./
        continue-on-error: true
        with:
          cli-scanner-version: '1.22.6'
          cli-scanner-sha256sum: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          image-tag: sysdiglabs/dummy-vuln-app:latest
          sysdig-secure-token: ${{ secrets.KUBELAB_SECURE_API_TOKEN }}

      - name: Check that the scan has failed
        run: |
          if [ "${{ steps.scan.outcome }}" == "failure" ]; then
            echo "Scan failed as expected."
          else
            echo "Scan succeeded but it should have failed due to incorrect checksum."
            exit 1
          fi
